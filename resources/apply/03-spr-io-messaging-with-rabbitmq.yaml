apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: spr-io-messaging-with-rabbitmq
spec:
  title: Messaging with RabbitMQ
  description: "Messaging with RabbitMQ"
  workshop:
    image: jdk17-environment:*
    files:
      - http:
          url: "$(ingress_protocol)://$(assets_repository)/$(workshop_name).tar.gz"
        includePaths:
          - /workshop/**
      - path: .local/share/code-server
        image:
          url: ghcr.io/spring-academy/vscode-java-tools-$(platform_arch)-files:0.25.14
      - path: exercises
        git:
          url: https://github.com/spring-academy/gs-messaging-rabbitmq.git
          ref: main
        newRootPath: .
  request:
    parameters:
    - name: USER_DOMAIN
      value: "unknown.domain"
    - name: USER_EMAIL
      value: "somebody@unknown.domain"
  session:
    env:
      - name: LAB_VERSION
        value: "${VERSION}"
      - name: WEBSERVER
        value: "$(ingress_protocol)://$(assets_repository)"
    namespaces:
      budget: medium
    resources:
      memory: 3Gi
    applications:
      terminal:
        enabled: true
        layout: default
      editor:
        enabled: true
      docker:
        enabled: true
        storage: 500Mi
        socket:
          # you must have this to enable docker ps, etc.
          enabled: true
        compose:
          services:
            rabbit-workshop:
              image: "rabbitmq:management"
              ports:
                - "5672:5672"
                - "15672:15672"
    dashboards:
      - name: Editor
      - name: Terminal
  environment:
    assets:
      memory: 0Mi
      ingress:
        enabled: true
      files:
        - image:
            url: ${CONTAINER_REGISTRY}${CONTAINER_REPOSITORY}:${VERSION}
          newRootPath: usr/share/nginx/html
